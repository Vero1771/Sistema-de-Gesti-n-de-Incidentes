<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestion de Incidentes - CORPOELEC</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="global-loader" class="loader-overlay">
    <div class="loader-spinner"></div>
    <p>Cargando...</p>
  </div>

  <div class="container">
    <div id="header-placeholder"></div>
    <div id="nav-placeholder"></div>
    <div id="page-content"></div>
    <div id="footer-placeholder"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="window.closeModal()">
        <img src="../icons/close.svg" alt="Close" class="close-icon">
      </span>
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="auth-modal" class="modal">
    <div class="modal-content auth-modal-content">
      <span class="close" id="auth-modal-close">
        <img src="../icons/close.svg" alt="Close" class="close-icon">
      </span>
      <h3 id="auth-modal-title">Iniciar Sesion</h3>
      <div id="auth-modal-body">
        <form id="auth-form">
          <div id="auth-fields">
            <div class="form-group" id="auth-name-group" style="display:none;">
              <label>Nombre Completo</label>
              <input type="text" id="auth-nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="auth-email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
              <label>Contraseña</label>
              <input type="password" id="auth-password" placeholder="Minimo 6 caracteres" required>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-cancel" id="auth-cancel">Cancelar</button>
            <button type="submit" class="btn-submit" id="auth-submit">
              <img src="../icons/lock.svg" alt="Auth" class="btn-icon">
              Iniciar Sesion
            </button>
          </div>
        </form>
        <div id="auth-error" class="error-text" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
