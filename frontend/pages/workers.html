<div class="page-container">
  <div class="toolbar">
    <div class="search-wrapper">
      <img src="../icons/search.svg" alt="Search" class="search-icon">
      <input type="text" id="search-workers" placeholder="Buscar trabajadores..." class="search-input">
    </div>
    <button id="btn-add-worker" class="btn-primary">
      <img src="../icons/add-worker.svg" alt="Add" class="btn-icon">
      Nuevo Trabajador
    </button>
  </div>
  <div class="table-container">
    <div id="workers-loader" class="loader-container" style="display:none;">
      <div class="loader-spinner"></div>
    </div>
    <table id="workers-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre Completo</th>
          <th>Cedula</th>
          <th>N° Trabajador</th>
          <th>Departamento</th>
          <th>Centro de Trabajo</th>
          <th>Cargo</th>
          <th>Genero</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="workers-tbody">
        <tr><td colspan="9" class="loading">Cargando trabajadores...</td></tr>
      </tbody>
    </table>
  </div>
</div>
