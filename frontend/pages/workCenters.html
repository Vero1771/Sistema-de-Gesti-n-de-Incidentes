<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centros de Trabajo - CORPOELEC</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="page-container">
    <div class="toolbar">
      <div class="search-wrapper">
        <img src="../icons/search.svg" alt="Search" class="search-icon">
        <input type="text" id="search-work-centers" placeholder="Buscar centros..." class="search-input">
      </div>
      <button id="btn-add-work-center" class="btn-primary">
        <img src="../icons/add.svg" alt="Add" class="btn-icon">
        Nuevo Centro
      </button>
    </div>
    <div class="table-container">
      <div id="work-centers-loader" class="loader-container" style="display:none;">
        <div class="loader-spinner"></div>
      </div>
      <table id="work-centers-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Ubicacion</th>
            <th>Trabajadores</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="work-centers-tbody">
          <tr><td colspan="5" class="loading">Cargando centros...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
