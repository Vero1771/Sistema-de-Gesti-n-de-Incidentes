<header class="app-header">
  <div class="header-content">
    <!-- MENU HAMBURGUESA -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
      <img src="../icons/menu.svg" alt="Menu">
    </button>

    <!-- TITULO -->
    <div class="header-title">
      <div class="logo-container">
        <img src="../icons/formation.svg" alt="Logo" class="header-logo">
        <div class="logo-pulse"></div>
      </div>
      <div class="header-text">
        <h1 class="header-title-text">Sistema de Gestion de Incidentes</h1>
        <p class="header-subtitle">CORPOELEC - Seguridad e Higiene Ocupacional</p>
      </div>
    </div>

    <!-- SECCION DERECHA -->
    <div class="header-right">
      <!-- USER NAME CON DROPDOWN -->
      <span id="user-name" class="user-name" style="display:none;">
        <img src="../icons/account-logged.svg" alt="User" class="user-icon">
        <span id="user-name-text"></span>
        <span class="dropdown-arrow">▾</span>
        <div class="user-dropdown" id="user-dropdown">
          <button class="dropdown-item danger" id="btn-logout-dropdown">
            <img src="../icons/close.svg" alt="Logout">
            Cerrar Sesion
          </button>
        </div>
      </span>

      <!-- BOTONES AUTH -->
      <div class="auth-buttons">
        <button id="btn-login" class="btn-primary btn-auth">
          <img src="../icons/lock.svg" alt="Login" class="btn-icon">
          Iniciar Sesion
        </button>
        <button id="btn-register" class="btn-secondary btn-auth">
          <img src="../icons/add.svg" alt="Register" class="btn-icon">
          Registrarse
        </button>
      </div>
    </div>
  </div>
</header>
